name: 远行商人监控

on:
  schedule:
    # 北京时间 08:10 / 12:10 / 16:10 / 20:10 — 每轮开始后 10 分钟触发（给 API 足够刷新时间）
    - cron: "10 0 * * *"   # UTC 00:10 = 北京 08:10
    - cron: "10 4 * * *"   # UTC 04:10 = 北京 12:10
    - cron: "10 8 * * *"   # UTC 08:10 = 北京 16:10
    - cron: "10 12 * * *"  # UTC 12:10 = 北京 20:10
  workflow_dispatch:  # 允许手动触发

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖 (Playwright)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libnspr4 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 运行监控
        env:
          ROCOM_API_KEY: ${{ secrets.ROCOM_API_KEY }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
          NOTIFYME_UUID: ${{ secrets.NOTIFYME_UUID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python main.py
