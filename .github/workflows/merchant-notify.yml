name: 远行商人监控

on:
  schedule:
    # 北京时间 08:30 / 12:30 / 16:30 / 20:30 — 每轮开始后 30 分钟触发
    # 配合 main.py 的轮次校验 + 内容稳定性检查，确保推送正确轮次的数据
    - cron: "30 0 * * *"   # UTC 00:30 = 北京 08:30
    - cron: "30 4 * * *"   # UTC 04:30 = 北京 12:30
    - cron: "30 8 * * *"   # UTC 08:30 = 北京 16:30
    - cron: "30 12 * * *"  # UTC 12:30 = 北京 20:30
  workflow_dispatch:  # 允许手动触发

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖 (Playwright)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libnspr4 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 运行监控
        env:
          ROCOM_API_KEY: ${{ secrets.ROCOM_API_KEY }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
          NOTIFYME_UUID: ${{ secrets.NOTIFYME_UUID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python main.py
